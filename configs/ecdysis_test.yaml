# Default training configuration file for MetaFG_2 in ecdysis02 server
# Uses 2 Nvidia RTX 3080 GPUs

DATA:
  DATASET: 'bugbox'
  IMG_SIZE: 384
  BATCH_SIZE: 4
  NUM_WORKERS: 4
MODEL:
  TYPE: MetaFG
  NAME: ecdysis
PRINT_FREQ: 10
SAVE_FREQ: 1000  # only save_csv best and last checkpoints
TRAIN:
  EPOCHS: 2
  BASE_LR: 16e-4
  MIN_LR: 16e-6
  WARMUP_EPOCHS: 1
  SAMPLER: 'weighted'
AUG:
  REMODE: 'random'
